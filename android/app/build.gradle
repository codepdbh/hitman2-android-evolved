plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'com.h2ae.android'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.h2ae.android'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-preview.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                targets 'h2ae', 'h2game'
            }
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }

    // Preview builds are signed with the standard Android debug key (public, password 'android'), the same key as
    // v0.2.0-preview.1, so this APK installs over the previous one. It is NOT a production signing key.
    signingConfigs {
        previewSigning {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.previewSigning }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
}
